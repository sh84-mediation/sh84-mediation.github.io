<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — страница ушла на переговоры — Школьная служба медиации № 84</title>
  <meta name="robots" content="noindex" />
  <meta name="description" content="Страница не найдена. Даже страницы иногда конфликтуют — мы уже договорились с этой." />
  <meta name="theme-color" content="#063d32" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&display=swap" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <script src="assets/js/extras.js" defer></script>
  <style>
    .p404 {
      min-height: calc(100dvh - var(--header-h));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(28px, 5vw, 64px) 0 clamp(40px, 6vw, 72px);
      color: var(--white);
      background:
        radial-gradient(900px 560px at 88% 4%, rgba(30, 154, 120, 0.36), transparent 62%),
        radial-gradient(700px 460px at 0% 100%, rgba(169, 237, 207, 0.14), transparent 60%),
        linear-gradient(180deg, #052c24 0%, var(--emerald-950) 100%);
    }
    .p404__card {
      max-width: 680px;
      text-align: center;
    }
    .p404__code {
      margin: 0;
      color: var(--mint);
      font-family: "Unbounded", "Manrope", system-ui, sans-serif;
      font-size: clamp(3.4rem, 12vw, 6rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.02em;
      cursor: default;
      user-select: none;
    }
    .p404 h1 {
      margin: 18px 0 10px;
      color: var(--white);
      font-size: clamp(1.3rem, 3.4vw, 1.8rem);
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -0.02em;
    }
    .p404__text {
      max-width: 46ch;
      margin: 0 auto;
      color: #b6d0c4;
      font-size: 0.90625rem;
      line-height: 1.7;
    }
    .p404__scene {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 14px;
      margin: clamp(24px, 4vw, 40px) 0 8px;
    }
    .p404__bubble {
      position: relative;
      max-width: 220px;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 0.8125rem;
      font-weight: 700;
      line-height: 1.45;
      text-align: left;
      animation: p404-float 4.2s ease-in-out infinite;
    }
    .p404__bubble--left {
      color: var(--emerald-950);
      background: var(--white);
      border-bottom-left-radius: 4px;
    }
    .p404__bubble--right {
      color: var(--emerald-950);
      background: var(--mint);
      border-bottom-right-radius: 4px;
      animation-delay: 0.7s;
    }
    .p404__shake {
      color: var(--mint);
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      line-height: 1;
      padding-bottom: 4px;
      opacity: 0;
      animation: p404-appear 1s var(--ease) 1.4s forwards;
    }
    @keyframes p404-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    @keyframes p404-appear {
      from { opacity: 0; transform: scale(0.4) rotate(-14deg); }
      to { opacity: 1; transform: scale(1) rotate(0deg); }
    }
    .p404__hint {
      margin: 10px 0 0;
      color: #8fb7a8;
      font-size: 0.75rem;
    }
    .p404__actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: clamp(20px, 3vw, 30px);
    }
    .p404 .button--primary {
      color: var(--emerald-950);
      background: var(--mint);
      border-color: var(--mint);
    }
    .p404 .button--primary:hover {
      background: var(--white);
      border-color: var(--white);
    }
    .p404 .button--outline {
      color: var(--white);
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.3);
    }
    .p404 .button--outline:hover {
      color: var(--emerald-950);
      background: var(--white);
      border-color: var(--white);
    }
    @media (max-width: 480px) {
      .p404__scene {
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .p404__bubble--left,
      .p404__bubble--right {
        max-width: 260px;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .p404__shake {
        opacity: 1;
        animation: none;
      }
      .p404__bubble {
        animation: none;
      }
    }
  </style>
  <link rel="prefetch" href="index.html" as="document" />
  <link rel="prefetch" href="team.html" as="document" />
  <link rel="prefetch" href="achievements.html" as="document" />
  <link rel="prefetch" href="gallery.html" as="document" />
  <link rel="prefetch" href="video.html" as="document" />
</head>
<body>
  <main id="main" class="p404">
    <div class="container p404__card">
      <p class="p404__code">404</p>
      <h1>Страница ушла на переговоры</h1>
      <p class="p404__text">Она обещала вернуться, когда стороны придут к соглашению. Пока что — вернём вас туда, где всё на месте.</p>

      <div class="p404__scene" aria-hidden="true">
        <div class="p404__bubble p404__bubble--left">Страница пропалась!</div>
        <div class="p404__shake">🤝</div>
        <div class="p404__bubble p404__bubble--right">Спокойно. Мы умеем договариваться.</div>
      </div>

      <div class="p404__actions">
        <a class="button button--primary" href="index.html">На главную</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer__legal">
        <p>© 2026 ГБОУ СОШ № 84 им. П. А. Покрышева. Школьная служба медиации.</p>
        <p><a href="index.html">Вернуться на главную</a></p>
      </div>
    </div>
  </footer>
</body>
</html>
